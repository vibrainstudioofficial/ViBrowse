[package]
name = "vibrowse"
version = "1.2.4"
description = "ViBrowse — Lightweight, low-RAM Chrome-compatible web browser built with Rust & Tauri"
authors = ["ViBrowse"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "dynamic-acl", "x11", "dbus", "unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["time", "sync", "fs", "io-util", "process", "rt-multi-thread"] }
url = "2"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
librqbit = { version = "8", default-features = false, features = ["default-tls"] }
adblock = { version = "0.13.6", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
gdk = "0.18"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = "symbols"

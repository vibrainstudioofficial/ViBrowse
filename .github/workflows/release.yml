name: Build & Publish Linux Packages (.deb & .rpm)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "V*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libdbus-1-dev pkg-config build-essential rpm
      - name: Build .deb and .rpm packages
        working-directory: app
        run: |
          sed -i 's/\r$//' scripts/build-linux.sh
          chmod +x scripts/build-linux.sh
          ./scripts/build-linux.sh
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: app/release/linux/*
      - name: Attach .deb and .rpm to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/release/linux/*.deb
            app/release/linux/*.rpm
